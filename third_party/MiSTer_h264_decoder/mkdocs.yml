# MkDocs configuration for the MiSTer H264 core manual.
#
#   site/content/ = the manual's markdown (docs_dir)
#   .site-build/  = build output (site_dir) -- gitignored, NEVER named "site"
#
# MkDocs' own defaults are docs_dir: docs and site_dir: site, and BOTH collide
# with this repo: docs/ is the engineering journal, and site/ is the manual's
# source. Both are overridden below so neither can be confused for the other.
#
# docs/ (engineering design notes) is deliberately NOT part of this build.

site_name: MiSTer H264
site_description: User and integrator manual for the MiSTer FPGA H.264 decode core
# Upstream's repository and Pages site. This fork does not publish the site; its
# build is a local check (site/README.md).
site_url: https://owenb321.github.io/MiSTer_h264_decoder/
site_author: owenb321

repo_url: https://github.com/owenb321/MiSTer_h264_decoder
repo_name: owenb321/MiSTer_h264_decoder
edit_uri: edit/main/site/content/

copyright: >
  GPL-3.0-or-later.

docs_dir: site/content
site_dir: .site-build

# A mistyped cross-link fails the build instead of shipping a 404.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: site/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Deliberately NOT docs/ -- nobody should be able to --8<-- an engineering
      # note into the manual.
      base_path: [site/content]
      check_paths: true

extra:
  # The newest PUBLISHED release, shown in the announcement bar. "0.0.0" means no
  # release exists yet; the release process bumps it.
  released_version: "1.1.0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/owenb321/MiSTer_h264_decoder
      name: MiSTer_h264_decoder on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Install the core: getting-started/install.md
      - What you need: getting-started/what-you-need.md
      - Loading the core: getting-started/loading.md
  - Using the core:
      - Settings: using/settings.md
      - Controls: using/controls.md
      - On-screen messages: using/on-screen-messages.md
      - Streaming from a PC (Moonlight): using/moonlight.md
      - Watching from a Jellyfin server: using/jellyfin.md
      - Playing video files: using/player.md
      - Showing a USB camera: using/camera.md
  - Video:
      - Video output: video/output.md
      - Analog and CRT output: video/analog-crt.md
  - Integrating a program:
      - Overview: integrating/overview.md
      - The interface: integrating/interface.md
      - The client library: integrating/library.md
      - Launch and input: integrating/launch.md
      - Audio: integrating/audio.md
      - Your own screens: integrating/overlay.md
      - Pictures you decode: integrating/pictures.md
  - Reference:
      - Compatibility: reference/compatibility.md
      - Troubleshooting: reference/troubleshooting.md
      - Reporting a bug: reference/reporting-a-bug.md
  - About:
      - Building from source: about/building.md
      - Acknowledgements: about/acknowledgements.md
